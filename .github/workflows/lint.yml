name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugin structure, versioning, and privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Single source of truth: the same script maintainers run locally
      # (and that the pre-push hook runs). Do NOT inline checks here —
      # add them to .maintainers/lint.sh instead.
      # The privacy scan's inputs are repository secrets so the list of private
      # identifiers never appears in this public repo (2026-09-17).
      - name: Run lint.sh
        env:
          SS_PRIVACY_PATTERNS: ${{ secrets.SS_PRIVACY_PATTERNS }}
          SS_INTERNAL_STRINGS: ${{ secrets.SS_INTERNAL_STRINGS }}
        run: ./.maintainers/lint.sh
